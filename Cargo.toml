[workspace]
members = ["crates/credvault-core", "crates/credvault-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Glavin001/CredVault"

[workspace.dependencies]
# Core
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Crypto & Secrets
aes = "0.8"
aes-gcm = "0.10"
cbc = "0.1"
pbkdf2 = "0.12"
argon2 = "0.5"
sha1 = "0.10"
hmac = "0.12"
secrecy = { version = "0.10", features = ["serde"] }
zeroize = "1"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# Serialization
rmp-serde = "1"
csv = "1.3"
base64 = "0.22"

# CLI
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"
dialoguer = "0.11"
comfy-table = "7"

# Random
rand = "0.9"

# Error handling
anyhow = "1"

# Testing
tempfile = "3"
